[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freecad-mcp"
version = "0.1.0"
description = "MCP server integrating FreeCAD with AI models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "FreeCAD MCP Contributors" }
]
keywords = ["freecad", "mcp", "cad", "ai", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mcp>=1.0.0",
    "gradio>=4.0.0",
    "pyzmq>=25.0.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
inference = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "accelerate>=0.24.0",
    "bitsandbytes>=0.41.0",
    "segment-anything-2>=0.1.0",
]
trellis = [
    "httpx>=0.25.0",
    "trimesh>=4.0.0",
]

[project.scripts]
freecad-mcp = "src.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
